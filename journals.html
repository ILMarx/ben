<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journals - Borderland Education Network</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="site-shell">
    <div id="nav-placeholder"></div>

    <main class="main-content">
      <section class="hero">
        <span class="eyebrow">Preservation Hub</span>
        <h2 class="section-title">Journals</h2>
        <p class="lead">This section provides access to preserved journal collections made available through the Preservation Hub.</p>
      </section>

      <section>
        <div class="journal-list">
          <a class="journal-row-card" href="journals/journal-slug/index.html">
            <img src="assets/images/placeholder.png" alt="" class="journal-row-logo">
            <div class="journal-row-text">
              <h3>Journal Title</h3>
            </div>
          </a>

          <div class="journal-row-card journal-row-card-muted">
            <img src="assets/images/placeholder.png" alt="" class="journal-row-logo">
            <div class="journal-row-text">
              <h3>Further journals</h3>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
</body>
</html>
